name: Lint Rust crates

on:
  - push
  - pull_request
  - workflow_call

jobs:
  lint-rust:
    name: Lint Rust crates (${{ matrix.target[1] }})
    strategy:
      # Windows is the only platform where one file has more than one valid path spelling, so the
      # path-key tests in discord_intl_message_database do not run anywhere else. Do not let a failure on
      # one platform hide the result on the other.
      fail-fast: false
      matrix:
        target:
          - [ 'macos-latest', 'darwin-arm64' ]
          - [ 'windows-latest', 'win32-x64-msvc' ]
    runs-on: ${{ matrix.target[0] }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Build Env
        uses: ./.github/actions/setup-build-env
        with:
          runner: ${{ matrix.target[0] }}
          target: ${{ matrix.target[1] }}

      - name: cargo-fmt
        # Formatting is platform independent, so only check it once.
        if: startsWith(matrix.target[0], 'macos')
        run: |
          cargo-fmt --all --check

      - name: Run Cargo test
        run: |
          cargo test
